# ============================================================================
#  MgCore — конфиг платформы мини-игр (шаблон).
#  Тексты игрокам — в messages.yml (MiniMessage). Здесь — только числа/флаги.
# ============================================================================

# Значения по умолчанию для НОВЫХ арен (у каждой арены свои копии в arena.yml).
arena-defaults:
  min-players: 2
  max-players: 12
  lobby-countdown-seconds: 20     # отсчёт в лобби до старта, когда набран минимум
  countdown-full-seconds: 5       # укороченный отсчёт, когда лобби заполнено
  match-duration-seconds: 0       # 0 = ядро не ограничивает; фазовый таймер матча ведёт сама игра (см. skyblockwars)

# Поведение матча (общее для всех игр на этом сервере).
match:
  # На смерть игрок становится спектатором (fake death), а не респавнится ванильно.
  spectator-on-death: true
  # Восстанавливать изменённые блоки и удалять заспавненные сущности после матча.
  restore-world: true
  # Телепортировать выживших/спектаторов обратно в лобби арены после матча.
  return-to-lobby: true

# Чат во время матча: игроки видят только участников своей арены.
chat:
  scoped-to-arena: true
  format: "<gray>[<arena>] <white><player><gray>: <reset><message>"

# HUD (если модуль включён): сайдбар и босс-бар матча.
hud:
  scoreboard: true
  bossbar: false   # MgCore рисует СВОЙ босс-бар прогресса эпох (per-player) — ядровой выключен

# Отладочный лог: [DBG] в консоль на ключевые действия (ASCII).
debug-log:
  enabled: false
  console: true

# ===== MgCore Reborn =====
# Игро-специфичные значения по умолчанию. Per-arena данные (центр/радиус/режим/эпохи)
# хранятся отдельно — в plugins/MgCore/game/<ID>.yml — и правятся командами /mg
# и GUI редактора эпох. Здесь — только дефолты для новых арен.
skyblockwars:
  radius-default: 40            # радиус кольца спавнов (/mg setradius <ID> default)
  epoch-mode-default: personal  # personal = у каждого своя цепочка эпох; shared = общая на арену
  # Тайминги фаз — ДЕФОЛТ для новых арен: значения копируются в game/<ID>.yml при создании
  # арены и дальше правятся per-arena (/mg settime <ID> match|fight <n|default> или GUI эпох).
  match-seconds: 1800           # длительность обычной фазы матча (30 мин), затем ломаются все блоки
  fight-seconds: 300            # схватка после слома блоков (5 мин), затем начинается разрушение арены
  destruction-rate: 0.08        # доля оставшихся поставленных блоков, исчезающих в секунду (фаза разрушения)
  destruction-max-seconds: 120  # предохранитель: если через столько секунд разрушения живы >1 — добить оставшихся
  lobby-duel: true              # разминка в лобби: PvP без смертей (авто-хил) + учёт нанесённого урона
